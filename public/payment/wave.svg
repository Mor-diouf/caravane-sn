<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background Wave Cyan -->
  <rect width="200" height="200" rx="40" fill="#1dc3ec"/>
  
  <!-- Feet -->
  <!-- Left Foot -->
  <ellipse cx="78" cy="172" rx="18" ry="10" fill="#ff7900"/>
  <!-- Right Foot -->
  <ellipse cx="122" cy="172" rx="18" ry="10" fill="#ff7900"/>

  <!-- Left Waving Wing / Arm -->
  <path d="M 68 100 C 42 85 36 68 46 64 C 58 59 72 78 78 95 Z" fill="#121214"/>

  <!-- Main Penguin Body -->
  <path d="M 72 45 
           C 72 20, 128 20, 128 45 
           C 128 65, 148 105, 148 145 
           C 148 168, 52 168, 52 145 
           C 52 105, 72 65, 72 45 Z" 
        fill="#121214"/>

  <!-- Right Wing / Arm resting -->
  <path d="M 132 90 C 146 100 148 120 142 135 C 138 125 134 110 130 95 Z" fill="#121214"/>

  <!-- Belly (White Oval) -->
  <ellipse cx="100" cy="120" rx="24" ry="34" fill="#ffffff"/>

  <!-- Eyes -->
  <circle cx="88" cy="48" r="4.5" fill="#ffffff"/>
  <circle cx="112" cy="48" r="4.5" fill="#ffffff"/>

  <!-- Beak -->
  <path d="M 86 58 Q 100 70 114 58 Q 100 54 86 58 Z" fill="#ff7900"/>
</svg>
