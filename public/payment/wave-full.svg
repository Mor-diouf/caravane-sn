<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" width="100%" height="100%">
  <defs>
    <!-- Wave official brand gradient -->
    <linearGradient id="waveBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1dc3ec"/>
      <stop offset="100%" stop-color="#00aee6"/>
    </linearGradient>
  </defs>

  <!-- Background with smooth rounded corners -->
  <rect width="420" height="180" rx="32" fill="url(#waveBg)"/>

  <!-- PENGUIN GROUP (LEFT) -->
  <g transform="translate(18, 10)">
    <!-- Feet -->
    <ellipse cx="62" cy="148" rx="17" ry="10" fill="#ff7900"/>
    <ellipse cx="104" cy="148" rx="17" ry="10" fill="#ff7900"/>

    <!-- Left Waving Arm / Wing -->
    <path d="M 52 86 C 28 72 22 56 32 52 C 44 48 57 65 62 82 Z" fill="#111315"/>

    <!-- Main Penguin Body -->
    <path d="M 58 38 
             C 58 14, 108 14, 108 38 
             C 108 58, 126 94, 126 126 
             C 126 146, 40 146, 40 126 
             C 40 94, 58 58, 58 38 Z" 
          fill="#111315"/>

    <!-- Right Wing (Resting) -->
    <path d="M 112 78 C 124 88 126 104 120 118 C 117 108 114 94 110 82 Z" fill="#111315"/>

    <!-- Belly (White Oval) -->
    <ellipse cx="83" cy="104" rx="22" ry="30" fill="#ffffff"/>

    <!-- Eyes -->
    <circle cx="73" cy="42" r="4.5" fill="#ffffff"/>
    <circle cx="93" cy="42" r="4.5" fill="#ffffff"/>

    <!-- Beak -->
    <path d="M 71 52 Q 83 62 95 52 Q 83 48 71 52 Z" fill="#ff7900"/>
  </g>

