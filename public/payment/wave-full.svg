             C 86 64, 96 78, 116 78 
             C 125 78, 133 74, 137 68 
             L 137 72 
             C 137 77, 142 80, 148 78 
             C 151 77, 153 74, 153 70 
             L 153 22 
             C 153 16, 148 14, 143 14 
             C 139 14, 137 16, 137 20 
             C 132 16, 124 14, 116 14 Z 
